[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-engine"
version = "0.1.0"
description = "AI Assessment Engine for Technology Architecture"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "google-adk",
    "google-api-core",
    "google-auth",
    "google-cloud-aiplatform",
    "google-cloud-discoveryengine",
    "google-cloud-documentai",
    "google-cloud-secret-manager",
    "google-genai",
    "httpx",
    "jinja2",
    "lxml",
    "matplotlib",
    "mcp<2",
    "networkx",
    "numpy",
    "openpyxl",
    "opentelemetry-distro",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "python-docx",
    "python-dotenv",
    "python-json-logger",
    "pyyaml",
    "requests",
    "rich",
    "scipy",
    "starlette",
    "tenacity",
    "vertexai",
]

[dependency-groups]
dev = [
    "duckduckgo-search>=8.0.0",
    "hypothesis>=6.100.0",
    "libcst>=1.4.0",
    "mypy>=1.10.0",
    "playwright>=1.45.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5.0",
]

[project.scripts]
assessment-engine = "assessment_engine.application.cli:main"
po-run = "assessment_engine.application.tools.run_product_owner_orchestrator:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "TD002", "TD003", "ERA"]
ignore = ["E501", "D100", "D104", "D205", "D209", "D107", "D103", "E402", "E701"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Exclude tests and legacy packages from strict docstring and commented-out code checks
"tests/**/*.py" = ["D", "ERA"]
"src/assessment_engine/**/*.py" = ["D", "ERA"]

# Relax docstring requirements in application helpers and adapters to prevent over-engineering
"src/application/**/*.py" = ["D101", "D102", "D103", "D107", "D205", "D417"]
"src/adapters/**/*.py" = ["D101", "D102", "D103", "D107", "D205", "D417"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
exclude = ["_PROJECT_ARCHIVE_/", "working/", "src/adapters/", "src/application/tools/", "src/application/render_", "src/application/generate_", "src/infrastructure/docx_render_utils.py"]

[[tool.mypy.overrides]]
module = [
    "pythonjsonlogger",
    "pythonjsonlogger.*",
    "rich.*",
    "google.*",
    "networkx",
    "opentelemetry.*",
    "tree_sitter",
    "tree_sitter_python",
    "mcp.*",
    "hypothesis",
    "tenacity",
    "vertexai.*",
    "docx.*",
    "matplotlib.*",
    "jinja2.*",
    "yaml.*",
    "pytest.*",
    "pytest_mock.*",
    "zipfile.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "adapters.*",
    "application.*",
    "assessment_engine.*",
    "infrastructure.*",
    "domain.*",
    "ports.*"
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "_PROJECT_ARCHIVE_", "_legacy", ".venv", "working", "diagnostics", "node_modules", ".hypothesis", "templates", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
addopts = "-ra -q -n auto --dist loadgroup"
markers = [
    "contract: marks tests that validate data contracts between pipeline stages"
]
filterwarnings = [
    "ignore::UserWarning:google.adk.features._feature_decorator",
    "ignore:This feature is deprecated as of June 24, 2025:UserWarning:vertexai.generative_models._generative_models",
    "ignore::FutureWarning:google.api_core.*",
    "ignore::FutureWarning:google.cloud.*",
]
