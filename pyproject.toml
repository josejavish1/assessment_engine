[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-engine"
version = "0.1.0"
description = "AI Assessment Engine for Technology Architecture"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "NTT DATA" }
]
dependencies = [
    "fastapi",
    "google-adk",
    "google-api-core",
    "google-auth",
    "google-cloud-aiplatform",
    "google-cloud-discoveryengine",
    "google-cloud-documentai",
    "google-cloud-secret-manager",
    "google-genai",
    "httpx",
    "jinja2",
    "lxml",
    "matplotlib",
    "mcp<2",
    "networkx",
    "numpy",
    "openpyxl",
    "opentelemetry-distro",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "python-docx",
    "python-dotenv",
    "python-json-logger",
    "pyyaml",
    "requests",
    "rich",
    "scipy",
    "starlette",
    "tenacity",
    "vertexai",
]

[dependency-groups]
dev = [
    "duckduckgo-search>=8.0.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.17",
    "libcst>=1.4.0",
    "mypy>=1.10.0",
    "playwright>=1.45.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5.0",
]

[project.scripts]
assessment-engine = "assessment_engine.application.cli:main"
assessment-api = "assessment_engine.adapters.api.server:main"
po-run = "assessment_engine.application.tools.run_product_owner_orchestrator:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "TD002", "TD003", "ERA"]
ignore = ["E501", "D100", "D104", "D205", "D209", "D107", "D103", "E402", "E701"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Exclude tests from strict docstring and commented-out code checks
"tests/**/*.py" = ["D", "ERA"]
"src/assessment_engine/**/*.py" = ["D", "ERA"]
"src/assessment_engine/adapters/compilers/payload_to_ast.py" = ["F841"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
exclude = ["workspaces/", "src/assessment_engine/application/tools/", "tests/diagnostics/"]

[[tool.mypy.overrides]]
module = [
    "pythonjsonlogger",
    "pythonjsonlogger.*",
    "rich.*",
    "google.*",
    "networkx",
    "opentelemetry.*",
    "tree_sitter",
    "tree_sitter_python",
    "mcp.*",
    "hypothesis",
    "tenacity",
    "vertexai.*",
    "docx.*",
    "matplotlib.*",
    "jinja2.*",
    "yaml.*",
    "pytest.*",
    "pytest_mock.*",
    "openpyxl",
    "openpyxl.*",
    "scipy",
    "scipy.*",
    "server",
    "zipfile.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "assessment_engine.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "workspaces", "diagnostics", "node_modules", ".hypothesis", "templates", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
addopts = "-ra -q -n auto --dist loadgroup"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: marks tests that validate data contracts between pipeline stages",
    "unit: marks isolated unit tests targeting domain, application, or adapter components",
    "integration: marks integration tests spanning multiple subsystems or IO boundaries",
    "architecture: marks architectural invariance, AST purity, and governance tests",
    "functional: marks end-to-end and functional validation tests",
    "calibration: marks multi-vertical and benchmark calibration suites",
    "certification: marks formal mathematical and actuarial certification suites",
    "slow: marks resource-heavy tests (e.g. headless LibreOffice DOCX compilation, full Monte Carlo sweeps)",
]
filterwarnings = [
    "ignore::UserWarning:google.adk.features._feature_decorator",
    "ignore:This feature is deprecated as of June 24, 2025:UserWarning:vertexai.generative_models._generative_models",
    "ignore::FutureWarning:google.api_core.*",
    "ignore::FutureWarning:google.cloud.*",
]

[tool.assessment_engine]
mutation_score_threshold = 85.0

[tool.importlinter]
root_packages = ["assessment_engine"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "hexagonal-domain-isolation"
name = "Domain layer isolation (hexagonal core)"
type = "forbidden"
source_modules = ["assessment_engine.domain"]
forbidden_modules = [
    "assessment_engine.infrastructure",
    "assessment_engine.adapters",
    "assessment_engine.application",
    "requests",
    "httpx",
    "aiohttp",
    "socket",
    "sqlalchemy",
    "boto3",
]

[[tool.importlinter.contracts]]
id = "application-adapters-isolation"
name = "Application must not import Adapters directly"
type = "forbidden"
source_modules = ["assessment_engine.application"]
forbidden_modules = [
    "assessment_engine.adapters",
]

[[tool.importlinter.contracts]]
id = "acyclic-domain-architecture"
name = "Domain must not have circular dependencies between siblings"
type = "acyclic_siblings"
ancestors = ["assessment_engine.domain"]


