domain_taxonomy_rules:
  T1:
    name: "Physical Data Center & Facilities"
    keywords: ["datacenter", "data center", "ups", "hvac", "cooling", "generator", "facilities", "power", "rack", "colocation", "raised floor"]
  T2:
    name: "Hybrid Compute & Virtualization Platforms"
    keywords: ["virtualization", "hypervisor", "virtual machine", "compute", "cluster", "container", "kubernetes", "bare metal", "server hosts", "cloud compute"]
  T3:
    name: "Networks & Connectivity Architecture"
    keywords: ["network", "switch", "routing", "lan", "wan", "sd-wan", "firewall", "vpn", "fiber", "bgp", "mpls", "transit", "interconnect"]
  T4:
    name: "Storage Systems & Data Protection"
    keywords: ["storage", "san", "nas", "storage array", "lun", "backup", "data protection", "immutable storage", "lakehouse", "data platform", "replication", "snapshot"]
  T5:
    name: "Operational Resilience & Disaster Recovery"
    keywords: ["resilience", "business continuity", "drp", "disaster recovery", "failover", "runbook", "cyber vault", "bcp", "recovery point", "failover drill"]
  T6:
    name: "Cybersecurity Architecture & Identity Governance"
    keywords: ["security", "cybersecurity", "identity", "active directory", "iam", "pam", "mfa", "rbac", "edr", "siem", "soc", "zero trust"]
  T7:
    name: "ITSM & Observability Operations"
    keywords: ["itsm", "service management", "cmdb", "change management", "incident management", "sla", "observability", "monitoring", "apm", "sre", "telemetry"]
  T8:
    name: "FinOps & Cloud Economics"
    keywords: ["finops", "cloud economics", "cost optimization", "software licensing", "cloud billing", "subscription", "it governance", "fiduciary"]
  T9:
    name: "Digital Workplace & End-User Productivity"
    keywords: ["workplace", "digital workplace", "endpoint", "laptop", "desktop", "vdi", "collaboration", "helpdesk", "service desk", "client compute"]
  T10:
    name: "Core Transactional Systems & Industrial Operations"
    keywords: ["modernization", "legacy", "technical debt", "core systems", "transactional", "industrial", "ot", "scada", "plc", "plant floor", "mes", "manufacturing", "dispatch"]

