vendor_id: "fortinet"
display_name: "Fortinet Security Fabric"
official_domains:
  - "fortinet.com"
  - "docs.fortinet.com"

coverage_domains:
  - domain_id: "HARDWARE_MATRIX"
    name: "Matriz Maestra de Hardware FortiGate"
    criticality: "CRITICAL"
