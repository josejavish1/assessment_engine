name: Assessment Engine CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python 3.11
      run: uv python install 3.11

    - name: Install dependencies
      run: |
        uv sync --frozen --all-groups
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    - name: Run pytest
      run: |
        pytest tests/

    - name: Run canonical smoke dry-run
      run: |
        python -m assessment_engine.application.tools.regenerate_smoke_artifacts --with-global --dry-run

    - name: Validate documentation governance
      run: |
        python src/assessment_engine/application/tools/validate_documentation_governance.py \
          --repo-root . \
          --documentation-map docs/documentation-map.yaml
