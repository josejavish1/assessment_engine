name: Incremental Quality Gate

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run incremental quality gate
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python src/assessment_engine/application/tools/run_incremental_quality_gate.py \
            --repo-root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Architectural Fitness Function (Golden Paths)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python src/assessment_engine/application/tools/run_golden_path_check.py \
            --repo-root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
