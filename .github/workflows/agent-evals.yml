name: Agent Evals (ELD)

on:
  schedule:
    - cron: '0 2 * * *' # Nightly
  pull_request:
    paths:
      - 'src/assessment_engine/application/tools/run_product_owner_orchestrator.py'
      - 'src/assessment_engine/domain/prompts/**'
      - 'src/assessment_engine/domain/schemas/**'
      - 'tests/agent_evals/**'

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/698614007938/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'assessment-bot@sub403o4u0q5.iam.gserviceaccount.com'

      - name: Run Agent Evals
        env:
          GOOGLE_CLOUD_PROJECT: "sub403o4u0q5"
          GOOGLE_CLOUD_LOCATION: "europe-west1"
        run: |
          python tests/agent_evals/run_evals.py

      - name: Run Live Model-Drift Integration Test (pytest)
        env:
          GOOGLE_CLOUD_PROJECT: "sub403o4u0q5"
          GOOGLE_CLOUD_LOCATION: "europe-west1"
          LIVE_TEST: "true"
        run: |
          python -m pytest tests/functional/test_agentic_benchmarker.py
