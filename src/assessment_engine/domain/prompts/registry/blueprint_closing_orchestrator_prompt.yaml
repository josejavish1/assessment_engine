prompt_details:
  description: Orchestrates the closing phase of Blueprint generation, consolidating analysis across all pillars to construct the global executive snapshot, transformation roadmap, and cross-tower dependencies.
  template: 'You are the {role}. Here is the consolidated technical analysis of all pillars for tower {tower_name}:

    {pillars_analysis_json}


    Based on this and the client strategic DNA: {intel_str}


    TASK AND TONE RULES:

    {task_and_tone_list}


    {structure_requirements_list}


    Return the information strictly in the requested structured JSON format.

    '
  variables:
  - description: The name of the architecture tower being orchestrated.
    name: tower_name
  - description: JSON with consolidated analysis across all pillars of the tower.
    name: pillars_analysis_json
  - description: Text with client strategic DNA and intelligence.
    name: intel_str
  - description: Target output language (e.g. 'Spanish', 'English', 'German', 'Japanese').
    name: target_language
role: Master Enterprise Orchestrator
structure_requirements:
  1: 'Generate ''executive_snapshot'': - ''bottom_line'': A comprehensive paragraph with the global technical diagnosis of the tower. - ''cost_of_inaction'': Severe operational and technical implications of maintaining the status quo. - ''decisions'': Copy EXACTLY 2-3 names of the most critical initiatives (projects_todo) defined in the pillars JSON. Do not invent new names. - ''structural_risks'': 2-3 major current architectural design risks. - ''business_impact'': How this modernization drives client business outcomes (M&A, Time-to-Market, etc.). - ''operational_benefits'': Key operational improvements expected (automation, resilience). - ''transformation_complexity'': Qualitative estimation of modernization effort and complexity (e.g. ''High complexity due to structural technical debt'', ''Medium, focused on operational standardization'').'
  2: 'Generate ''cross_capabilities_analysis'': Comprehensive architectural posture before pillar deep-dives. - ''common_deficiency_patterns'': 2-3 bullet points on transversal deficiencies spanning multiple pillars (silos, manual toil). - ''transformation_paradigm'': A paragraph explaining the architectural north star of this tower. - ''critical_technical_debt'': A paragraph summarizing which legacy elements are blocking modernization.'
  3: 'Generate ''design_principles'': Deduce a transversal set of 3 to 7 Master Design Principles (e.g. "Security by Design", "Sovereign Edge") governing the tower.'
  4: 'Generate ''roadmap'': Sequence ALL pillar initiatives across 3 Waves (Wave 1: 0-6m, Wave 2: 6-12m, Wave 3: 12-24m). UNBREAKABLE MANDATE: YOU MUST INCLUDE ABSOLUTELY EVERY INITIATIVE from the pillar analysis without omission.'
  5: 'Generate ''external_dependencies'': Map exact initiative-to-initiative dependencies.'
task_and_tone:
- 'EXPAND YOUR EXPLANATIONS BY 50%: Extensively develop business justifications, technical diagnoses, and operational impacts in robust paragraphs.'
- 'TARGET AUDIENCE: Technical Decision-Makers (Head of IT, Enterprise Architecture, Infrastructure Operations).'
- 'THIRD PERSON OBJECTIVITY: Never use first-person pronouns (''we'', ''our''). The subject is always ''the client platform'', ''the current architecture'', etc.'
- 'TONE: Objective, analytical, and authoritative engineering consulting.'
- 'OUTPUT LANGUAGE MANDATE: You MUST generate all narratives, descriptions, and structural summaries EXCLUSIVELY in the target language ({target_language}).'
- 'STRICT FORMATTING: STRICTLY PROHIBITED from using Markdown asterisks (**text**) for bolding. Lists must contain simple strings.'
- 'STRATEGIC VENDOR ALIGNMENT: Identify and align with the primary client cloud hyperscaler and enterprise technology ecosystem based strictly on business context.'
- 'ELITE DIPLOMACY (Tier 1): Avoid accusatory adjectives. Describe risks objectively as ''material exposure'' or ''structural deviations''.'
