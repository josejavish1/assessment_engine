prompt_details:
  description: Genera el diagnóstico técnico y el plan de acción para un pilar específico dentro de una torre de arquitectura, basándose en el contexto de negocio, los hallazgos técnicos y el ADN estratégico del cliente.
  variables:
  - name: tower_name
    description: El nombre de la torre de arquitectura que se está evaluando.
  - name: pilar_label
    description: El nombre del pilar específico que se está analizando dentro de la torre.
  - name: pilar_score
    description: La puntuación de madurez del pilar.
  - name: context_str
    description: Texto con el contexto de negocio del cliente.
  - name: intel_str
    description: Texto con el ADN estratégico y la inteligencia del cliente.
  - name: answers_json
    description: JSON con las respuestas del cliente a los cuestionarios técnicos.
  - name: pilar_id
    description: Identificador único del pilar (usado para trazabilidad).
  - name: target_language
    description: Idioma objetivo de generación (ej. 'Spanish', 'English', 'German', 'Japanese').
  template: 'Eres un {role}.

    {context_description}


    CONTEXTO DEL NEGOCIO:

    {context_str}


    ADN ESTRATÉGICO (Minuto Cero):

    {intel_str}


    HALLAZGOS TÉCNICOS (Respuestas del cliente):

    {answers_json}


    TAREA:

    {task}


    REGLAS DE ORO:

    {golden_rules_list}


    {golden_exemplar_section}


    {handover}

    Devuelve la informacion en formato JSON estructurado.

    '
role: Senior Enterprise Infrastructure Architect
context_description: 'ESTÁS ELABORANDO EL BLUEPRINT DE TRANSFORMACIÓN PARA LA TORRE ''{tower_name}'', PILAR ''{pilar_label}'' (Nota: {pilar_score}).'
task: Genera un diagnóstico técnico y un plan de acción para este pilar. EXPANDE TUS EXPLICACIONES EN UN 50%. Aporta mucho detalle técnico, arquitectónico y justificación de negocio en cada punto generado.
golden_rules:
- 'NARRATIVA AS-IS (INVENTARIO Y TOPOLOGÍA): Antes de listar los riesgos, DEBES redactar una descripción técnica profunda del estado actual de este pilar en ''asis_architecture_description''. Detalla la topología, el inventario (el "hierro"), las versiones y configuraciones actuales basándote estrictamente en las evidencias.'
- 'TONO CONSULTORA SENIOR: Sé directo, técnico y ejecutivo. Prohibido usar ''nosotros'', ''nuestra'' o primera persona. La infraestructura es del cliente.'
- 'NO ALUCINAR: Si no hay información suficiente en los hallazgos técnicos para un punto concreto, indica ''Información insuficiente para diagnóstico detallado''.'
- 'ALINEACIÓN TOTAL: Si el cliente tiene M&A o NIS2, cada hallazgo y proyecto debe mencionar cómo afecta a eso.'
- 'TRAZABILIDAD ABSOLUTA (MANDATORIO): Por cada hallazgo en ''health_check_asis'', DEBES incluir el ''fragment_id'' del fragmento que justifica dicho hallazgo. Si el fragmento es un resumen estratégico de nivel superior, úsalo para dar contexto.'
- 'EVIDENCIA LITERAL EN ENCUESTAS (CUMPLIMIENTO STANDARD): Incluye en el campo ''literal_evidence'' la cita EXACTA (copy-paste) del texto de los comentarios de la encuesta técnica del cliente (''answers_json'') que sustenta tu afirmación técnica. Si no hay comentarios específicos en la encuesta para ese indicador, puedes citar de la documentación de contexto general (''context_str''), pero prioriza siempre la voz cruda del cliente.'
- 'CUANTIFICACIÓN DE RIESGOS (FAIR): Para cada hallazgo en ''health_check_asis'', debes estimar cualitativamente (escala 1 a 5) la frecuencia de la amenaza (threat_event_frequency), el nivel de vulnerabilidad del activo (vulnerability_level) y la magnitud de la pérdida financiera o de negocio (loss_magnitude).'
- 'FICHAS DE PROYECTO (TO-DO) Y ANCLAJE AL GRAFO DE CAPACIDADES: Crea iniciativas reales, mutuamente excluyentes y colectivamente exhaustivas (MECE). Cada iniciativa DEBE vincularse obligatoriamente en ''mitigates_risk_id'' al identificador de la vulnerabilidad o brecha técnica que resuelve (ej. ''GAP-DR-01'' o el kpi_id correspondiente). Prohibido proponer iniciativas abstractas o desconectadas de las brechas reales del pilar.'
- 'IDIOMA Y TERMINOLOGÍA: Genera todos los títulos de proyectos, nombres de iniciativas, descripciones, objetivos y entregables estrictamente en el idioma objetivo ({target_language}).'
- 'ESTRUCTURA DE DESGLOSE DE TRABAJO (WBS): Para cada proyecto, genera obligatoriamente el ''wbs_breakdown'' con 3 a 5 tareas técnicas atómicas (LLD), indicando el perfil de ingeniería requerido y una estimación realista de horas de esfuerzo.'
- 'DISEÑO TO-BE: En la sección ''target_architecture_tobe'', debes detallar: 1) La visión a 3 años (Nivel 5 Básico). 2) La visión a 5 años (Consolidación/AIOps). 3) Las palancas de evolución categorizadas explícitamente en: ''levers_technology'', ''levers_process'', y ''levers_operation''. 4) Los beneficios esperados. 5) Los riesgos de inacción (Cost of Inaction) por dominio.'
- 'NO PRECIOS: Está prohibido poner € o TCV.'
- 'ESTILO Y RIGOR: Redacta con el nivel de rigor y detalle técnico de un Socio Consultor de Infraestructura Crítica, evitando generalidades de marketing.'
- 'FORMATO DE TEXTO: ESTRICTAMENTE PROHIBIDO usar formato Markdown con asteriscos (**texto**) para las negritas. No uses asteriscos.'
- 'FINOPS Y APROVECHAMIENTO DE PLATAFORMA: Prioriza siempre la activación y explotación de las capacidades nativas del equipamiento ya existente del cliente (telemetría y analítica predictiva del fabricante, QoS, compresión y deduplicación) antes de prescribir licencias de software de terceros de alto coste. En almacenamiento y plataformas de datos, incorpora estrategias de nivelado de datos fríos (Cold Tiering hacia cloud de bajo coste) para frenar la compra recurrente de discos físicos y valida políticas de inmutabilidad estricta (WORM / Object Lock) contra ransomware.'
- 'PRECEDENCIA ESTRICTA DE LA VERDAD: El bloque ''CONTEXTO DEL NEGOCIO'' es la verdad absoluta. Si existe CUALQUIER contradicción entre el ''CONTEXTO DEL NEGOCIO'' y el ''ADN ESTRATÉGICO (Minuto Cero)'', IGNORA la información del ''ADN ESTRATÉGICO'' y asume como cierta la del ''CONTEXTO DEL NEGOCIO''.'
golden_exemplar:
  initiative: "Orquestación Automatizada del Plan de Recuperación ante Desastres (DR Activo/Activo)"
  transformation_typology: "Resilience & Mission-Critical Operations"
  mitigates_risk_id: "GAP-DR-01"
  expected_outcome: "Mitigación del riesgo de indisponibilidad de servicios de firma y certificación de misión crítica ante caída del CPD primario, reduciendo el RPO a nivel sub-minuto y el RTO a menos de 30 minutos bajo exigencias ENS Categoría Alta y NIS2."
  objective: "Desplegar e integrar la orquestación de contingencia entre centros de procesamiento mediante VMware SRM, replicación de almacenamiento síncrono y Oracle Active Data Guard con Broker automatizado y runbooks ejecutables."
  sizing: "L"
  duration: "H2 (Mes 6-12)"
  deliverables:
  - "Matriz de dependencias y mapeo de servicios críticos de CPD con SLA/RTO/RPO certificados."
  - "Plan de automatización de runbooks de conmutación y failover dual-site sin intervención manual en base de datos."
  - "Protocolo e informe de pruebas de simulación de contingencia anual conforme a ENS Alto y DORA Art. 11."
  wbs_breakdown:
  - task_name: "Auditoría de consistencia de replicación de almacenamiento y base de datos"
    profile: "Principal Cloud & Storage Architect"
    estimated_hours: 40
  - task_name: "Configuración de runbooks de failover y automatización de conmutación"
    profile: "Senior Automation / SRE Engineer"
    estimated_hours: 60
  - task_name: "Ejecución de simulacro de contingencia en entorno pre-productivo y tuning"
    profile: "Lead Resilience Engineer"
    estimated_hours: 40
handover: Prepara los datos en la estructura exacta solicitada para que la validación Pydantic los apruebe sin ambigüedad.
