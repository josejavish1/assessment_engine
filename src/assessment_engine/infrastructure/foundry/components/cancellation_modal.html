
<!-- Modal de Gestión y Cancelación de Cita / Reserva (FSM Operativa & WCAG AAA) -->
<div id="modal-cancel-booking" role="dialog" aria-modal="true" aria-labelledby="cancel-modal-title" class="hidden fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 text-stone-100">
  <div class="bg-stone-900 border border-stone-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b border-stone-800 pb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="calendar-x" class="w-5 h-5 text-rose-400"></i>
        <h3 id="cancel-modal-title" class="font-bold text-sm text-white">Cancelar o Reprogramar Cita</h3>
      </div>
      <button onclick="closeCancelModal()" aria-label="Cerrar modal de cancelación" class="text-xs text-stone-400 hover:text-white p-1">✕</button>
    </div>
    <div class="space-y-3 text-xs text-stone-300">
      <p>Indica el localizador o identificador de tu cita para liberar la franja horaria:</p>
      <input type="text" id="cancel-booking-id" aria-label="Localizador o Identificador de Cita" placeholder="Ej. PED-2919" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2 font-mono text-xs text-white focus:border-rose-500 outline-none">
      <label class="block text-stone-400 font-semibold mt-2">Motivo de la cancelación:</label>
      <select id="cancel-booking-reason" class="w-full bg-stone-950 border border-stone-800 rounded-lg p-2 text-stone-200 focus:border-rose-500 outline-none">
        <option value="incompatibilidad_horaria" selected>Incompatibilidad horaria imprevista</option>
        <option value="reprogramacion">Deseo reprogramar para otra fecha</option>
        <option value="motivos_personales">Motivos personales / de salud</option>
      </select>
    </div>
    <div class="flex gap-2 pt-2">
      <button onclick="closeCancelModal()" class="flex-1 py-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 font-bold text-xs transition">
        Mantener Cita
      </button>
      <button onclick="executeCancellationAction()" class="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs transition">
        Confirmar Cancelación
      </button>
    </div>
  </div>
</div>
