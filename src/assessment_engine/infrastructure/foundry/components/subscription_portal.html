
<!-- Universal Polymorphic Subscription Self-Management Portal -->
<div id="subscription-portal-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-stone-900 border border-stone-800 rounded-2xl max-w-md w-full p-6 text-stone-100 shadow-2xl space-y-6">
    <div class="flex justify-between items-center border-b border-stone-800 pb-4">
      <div>
        <h3 id="portal-title" class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="refresh-cw" class="w-5 h-5 text-amber-400"></i> Mi Suscripción
        </h3>
        <p id="portal-subtitle" class="text-xs text-stone-400 mt-1">Autogestión de entregas, periodicidad y pausas</p>
      </div>
      <button onclick="closeSubscriptionPortal()" aria-label="Cerrar portal de suscripción" class="text-stone-400 hover:text-white p-1 rounded-lg">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Buscador / Verificación de email -->
    <div id="portal-login-section" class="space-y-3">
      <label class="block text-xs font-semibold text-stone-300">Email de suscriptor:</label>
      <div class="flex gap-2">
        <input type="email" id="portal-email-input" aria-label="Email de suscriptor" placeholder="tu@email.com" class="w-full bg-stone-950 border border-stone-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
        <button onclick="fetchPortalSubscriptions()" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs px-4 py-2 rounded-lg transition whitespace-nowrap">
          Consultar
        </button>
      </div>
      <p id="portal-email-error" class="text-xs text-red-400 hidden"></p>
    </div>

    <!-- Contenido de la Suscripción -->
    <div id="portal-details-section" class="hidden space-y-4">
      <div class="bg-stone-950/60 p-4 rounded-xl border border-stone-800 space-y-2.5">
        <div class="flex justify-between items-start">
          <div>
            <span id="portal-sub-plan" class="text-sm font-bold text-white">Suscripción Origen Único</span>
            <div id="portal-sub-price" class="text-xs font-mono text-amber-400 mt-0.5">16.00€ / entrega</div>
          </div>
          <span id="portal-sub-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
            ACTIVA
          </span>
        </div>
        <div class="text-xs text-stone-300 flex items-center gap-1.5 pt-1">
          <i data-lucide="calendar" class="w-4 h-4 text-stone-400"></i>
          <span id="portal-next-date-label">Próximo cobro/envío:</span> <strong id="portal-sub-next-date" class="text-white font-mono">2026-11-06</strong>
        </div>
        <div class="text-xs text-stone-400 flex items-center gap-1.5">
          <i data-lucide="clock" class="w-4 h-4 text-stone-500"></i>
          Periodicidad: <span id="portal-sub-frequency" class="text-stone-300">Cada 30 días</span>
        </div>
      </div>

      <!-- Acciones de Autogestión -->
      <div class="space-y-2 pt-1">
        <p class="text-[11px] font-bold text-stone-400 uppercase tracking-wider">Acciones disponibles</p>
        <div class="grid grid-cols-2 gap-2">
          <button id="portal-btn-pause" onclick="executePortalAction('pause')" class="p-2.5 bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-xl text-xs font-semibold text-stone-200 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="pause-circle" class="w-4 h-4 text-amber-400"></i> Pausar 14 días
          </button>
          <button id="portal-btn-skip" onclick="executePortalAction('skip')" class="p-2.5 bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-xl text-xs font-semibold text-stone-200 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="skip-forward" class="w-4 h-4 text-blue-400"></i> Saltar entrega
          </button>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <label class="text-xs text-stone-300 whitespace-nowrap">Periodicidad:</label>
          <select id="portal-select-freq" onchange="executePortalChangeFreq(this.value)" class="w-full bg-stone-950 border border-stone-700 rounded-lg px-2.5 py-1.5 text-xs text-stone-200 focus:outline-none focus:border-amber-500">
            <option value="15">Cada 15 días</option>
            <option value="30" selected>Cada 30 días</option>
            <option value="60">Cada 60 días</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
